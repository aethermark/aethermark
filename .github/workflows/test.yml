name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build, Test, and Lint
    runs-on: ubuntu-latest

    steps:
      # -------------------- Checkout --------------------
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # -------------------- APT / system deps --------------------
      - name: Install system packages (G++ 14, CMake, Make, GTest)
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-14 g++-14-multilib cmake make libgtest-dev
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100

      # -------------------- Python Setup --------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: "pip"

      # -------------------- Cache pip packages --------------------
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # -------------------- Virtual environment --------------------
      - name: Ensure virtual environment
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip wheel
          if [ -f requirements-dev.txt ]; then .venv/bin/pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then .venv/bin/pip install -r requirements.txt; fi
          .venv/bin/pip install pre-commit pylint

      # -------------------- Cache pre-commit envs --------------------
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-precommit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-precommit-

      # -------------------- Cache per-build-dir --------------------
      - name: Cache C++ and Python builds
        uses: actions/cache@v4
        with:
          path: |
            build/test
            build/python
            python/dist
          key: ${{ runner.os }}-build-${{ hashFiles('src/**/*.cpp', 'include/**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-build-

      # -------------------- Pull submodules --------------------
      - name: Pull submodules
        run: git submodule update --init --recursive

      # -------------------- Build C++ tests --------------------
      - name: Build and run C++ tests
        run: |
          make test-cpp

      # -------------------- Build Python extension & package --------------------
      - name: Build Python extension
        run: |
          make build-python-ext

      - name: Build Python package
        run: |
          make build-py

      # -------------------- Run Python tests --------------------
      - name: Run Python tests
        run: |
          .venv/bin/python -m pytest -v python

      # -------------------- Static type checking --------------------
      - name: Run Python type check
        run: |
          make test-py-static-typecheck

      # -------------------- Lint --------------------
      - name: Run linting & formatting
        run: |
          .venv/bin/pre-commit install
          .venv/bin/pre-commit run --all-files --show-diff-on-failure --verbose
